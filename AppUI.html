<script>
    // --- GLOBAL APP STATE ---
    // Maps base URL is built from pieces on purpose: Apps Script's HTML delivery
    // can choke on double slashes inside template literals.
    const MAPS_SEARCH_BASE = 'https:' + '/' + '/www.google.com/maps/search/';

    let currentUser = null;
    let currentView = '';
    let activeDealershipId = null;
    let draggedDealershipId = null;

    // Route Planner Specific State
    let goldenFilterActive = false;
    let suggestTab = 'prospects';
    let currentInsertIndex = -1;
    let draggedActId = null;

    const filters = { hideConfirmed: true, types: [], statuses: [] };

    // --- UTILITY FUNCTIONS ---
    const generateId = (prefix) => prefix + Math.random().toString(36).substr(2, 9);
    const formatDate = (date) => date ? new Date(date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Never';
    const daysBetween = (d1, d2) => Math.floor((new Date(d2) - new Date(d1)) / (1000 * 60 * 60 * 24));

    function closeModal(id) {
        const el = document.getElementById(id);
        if (el) el.classList.add('hidden');
    }

    function getRealStatus(d) {
        if (d.status === 'Handed Off') {
            const p = db.payouts.find(x => x.dealershipId === d.id);
            if (p) return p.meetingCompleted ? 'Handoff Confirmed' : 'Handoff In Process';
        }
        const today = new Date();
        if ((d.status === 'Uncontacted' || d.status === 'In Progress') && d.lastTouchpointDate) {
            if (daysBetween(d.lastTouchpointDate, today) > 60) return 'Auto-Parked';
        }
        return d.status;
    }

    function getStageForDeal(d) {
        const realStatus = getRealStatus(d);
        if (realStatus.includes('Handoff') || d.status === 'Handed Off') return 'Handed Off';
        if (realStatus === 'Parked' || realStatus === 'Auto-Parked') return 'Parked';
        return realStatus;
    }

    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const bgColor = type === 'success' ? 'bg-green-50 border-green-200 text-green-800' : 'bg-red-50 border-red-200 text-red-800';
        const icon = type === 'success' ? '<i class="fa-solid fa-check-circle text-green-500"></i>' : '<i class="fa-solid fa-circle-exclamation text-red-500"></i>';

        toast.className = `flex items-center gap-3 p-4 rounded-lg border shadow-lg ${bgColor} pointer-events-auto toast-enter bg-white z-[110]`;
        toast.innerHTML = `${icon} <span class="font-medium text-sm">${message}</span>`;
        
        container.appendChild(toast);
        setTimeout(() => {
            toast.classList.replace('toast-enter', 'toast-exit');
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    }

    // --- INITIALIZATION ---
    window.onload = () => {
        try { initTheme(); } catch (e) { console.warn('Theme init failed', e); }
        switchPersona('u_rep_vet');
        applyFilters();
    };

    // --- THEME MANAGEMENT ---
    function safeStorageGet(key) {
        try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function safeStorageSet(key, val) {
        try { localStorage.setItem(key, val); } catch (e) { /* storage blocked in Apps Script sandbox */ }
    }

    function initTheme() {
        const savedTheme = safeStorageGet('theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        setDarkMode(savedTheme === 'dark' || (!savedTheme && prefersDark));
    }

    function toggleTheme() {
        const isDark = document.documentElement.classList.contains('dark');
        setDarkMode(!isDark);
    }

    function setDarkMode(enableDark) {
        const icon = document.getElementById('theme-icon');
        document.documentElement.classList.toggle('dark', enableDark);
        safeStorageSet('theme', enableDark ? 'dark' : 'light');
        if (icon) {
            icon.classList.toggle('fa-sun', enableDark);
            icon.classList.toggle('fa-moon', !enableDark);
        }
    }

    function toggleSidebar() {
        const sb = document.getElementById('sidebar');
        const icon = document.getElementById('sidebar-toggle-icon');
        sb.classList.toggle('sidebar-contracted');
        if (sb.classList.contains('sidebar-contracted')) {
            icon.classList.remove('fa-chevron-left');
            icon.classList.add('fa-chevron-right');
        } else {
            icon.classList.remove('fa-chevron-right');
            icon.classList.add('fa-chevron-left');
        }
    }

    // --- NAVIGATION & PERSONA ---
    function switchPersona(userId) {
        currentUser = db.users.find(u => u.id === userId);
        
        document.getElementById('user-name').innerText = `${currentUser.firstName} ${currentUser.lastName}`;
        document.getElementById('user-avatar').innerText = currentUser.firstName.charAt(0);
        document.getElementById('user-role').innerText = currentUser.role;

        document.querySelectorAll('[class*="nav-group-"]').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll(`.nav-group-${currentUser.role}`).forEach(el => el.classList.remove('hidden'));

        if(currentUser.role === 'rep' || currentUser.role === 'manager') nav('dashboard');
        else if(currentUser.role === 'executive') nav('exec');
        else if(currentUser.role === 'finance') nav('finance');
        else if(currentUser.role === 'admin') nav('admin');

        const personaSelect = document.getElementById('persona-selector');
        if (personaSelect) personaSelect.value = userId;
    }

    function nav(target) {
        currentView = target;
        
        document.querySelectorAll('.nav-btn').forEach(btn => {
            if (btn.dataset.target === target) {
                btn.classList.add('bg-brand-50', 'text-brand-600');
                btn.classList.remove('text-gray-600', 'hover:bg-gray-50');
            } else {
                btn.classList.remove('bg-brand-50', 'text-brand-600');
                btn.classList.add('text-gray-600', 'hover:bg-gray-50');
            }
        });

        document.querySelectorAll('.view-panel').forEach(el => el.classList.add('hidden'));
        document.getElementById(`view-${target}`).classList.remove('hidden');
        document.getElementById('mobile-menu').classList.add('hidden');

        if (target === 'dashboard') {
            document.getElementById('page-title').innerText = "Dashboard & Route Planner";
            renderDashboard();
        } else if (target === 'pipeline') {
            document.getElementById('page-title').innerText = "Pipeline Board";
            renderPipeline();
        } else if (target === 'dealerships') {
            document.getElementById('page-title').innerText = "The Bench (Prospects)";
            renderDealerships();
        } else if (target === 'clients') {
            document.getElementById('page-title').innerText = "Client Portfolio";
            renderClients();
        } else if (target === 'pool') {
            document.getElementById('page-title').innerText = "Prospect Pool";
            renderPool();
        } else if (target === 'payouts') {
            document.getElementById('page-title').innerText = "Payouts Pipeline";
            renderPayouts();
        } else if (target === 'manager') {
            document.getElementById('page-title').innerText = "Team Dashboard";
            renderManager();
        } else if (target === 'exec') {
            document.getElementById('page-title').innerText = "Inbound Handoffs";
            renderExecutive();
        } else if (target === 'finance') {
            document.getElementById('page-title').innerText = "Finance Approvals";
            renderFinance();
        } else if (target === 'admin') {
            document.getElementById('page-title').innerText = "System Administration";
            renderAdmin();
        }
    }

    // --- ROUTE PLANNER ---
    function setSuggestTab(tab) {
        suggestTab = tab;
        document.getElementById('tab-suggest-prospects').className = tab === 'prospects' ? "flex-1 py-1.5 text-xs font-bold rounded-md bg-white shadow-sm text-gray-800 transition-all border border-gray-200" : "flex-1 py-1.5 text-xs font-bold rounded-md text-gray-500 hover:text-gray-800 transition-all border border-transparent hover:bg-gray-100 cursor-pointer";
        document.getElementById('tab-suggest-clients').className = tab === 'clients' ? "flex-1 py-1.5 text-xs font-bold rounded-md bg-white shadow-sm text-gray-800 transition-all border border-gray-200" : "flex-1 py-1.5 text-xs font-bold rounded-md text-gray-500 hover:text-gray-800 transition-all border border-transparent hover:bg-gray-100 cursor-pointer";
        renderDashboard();
    }

    function toggleGoldenFilter() {
        goldenFilterActive = !goldenFilterActive;
        const btn = document.getElementById('modal-golden-filter-btn');
        if (btn) {
            if (goldenFilterActive) {
                btn.classList.add('bg-yellow-50', 'text-yellow-600', 'border-yellow-200');
                btn.classList.remove('bg-white', 'text-gray-400', 'border-gray-200');
                showToast("Golden Targets filter ON (50+ Cars & Franchise)");
            } else {
                btn.classList.remove('bg-yellow-50', 'text-yellow-600', 'border-yellow-200');
                btn.classList.add('bg-white', 'text-gray-400', 'border-gray-200');
            }
        }
        renderDashboard();
    }

    function renderDashboard() {
        const myDeals = db.dealerships.filter(d => d.ownerId === currentUser.id);
        document.getElementById('stat-bench').innerText = myDeals.length;
        
        let decayCount = 0, activeCount = 0;
        const today = new Date();

        myDeals.forEach(d => {
            if (!d.lastTouchpointDate || daysBetween(d.lastTouchpointDate, today) > 30) decayCount++;
            else activeCount++;
        });

        document.getElementById('stat-decay').innerText = decayCount;
        document.getElementById('stat-active').innerText = activeCount;

        const myPayouts = db.payouts.filter(p => p.repId === currentUser.id);
        document.getElementById('stat-payouts').innerText = myPayouts.length;

        const dateInput = document.getElementById('planner-date');
        if (!dateInput.value) {
            const d = new Date();
            dateInput.value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
        const selectedDateStr = dateInput.value;

const scheduledActs = db.activities.filter(a => {
            if (a.repId !== currentUser.id || a.plannedDate !== selectedDateStr || a.status !== 'pending') return false;
            const deal = myDeals.find(d => d.id === a.dealershipId);
            if (!deal || deal.status === 'Handed Off') return false;
            return true;
        });
        const scheduledDealershipIds = scheduledActs.map(a => a.dealershipId);
        const scheduledDeals = scheduledActs.map(act => myDeals.find(d => d.id === act.dealershipId)).filter(Boolean);
        
        let suggestedDeals = myDeals.filter(d => !scheduledDealershipIds.includes(d.id));

        if (suggestTab === 'prospects') {
            suggestedDeals = suggestedDeals.filter(d => d.status !== 'Client' && d.status !== 'Onboarding' && d.status !== 'Handed Off');
            if (goldenFilterActive) {
                suggestedDeals = suggestedDeals.filter(d => {
                    const isDecaying = !d.lastTouchpointDate || daysBetween(d.lastTouchpointDate, today) > 30;
                    return d.usedCarsOnLot >= 50 && d.dealershipType === 'Franchise' && (isDecaying || d.status === 'Uncontacted');
                });
            }
        } else {
            suggestedDeals = suggestedDeals.filter(d => d.status === 'Client' || d.status === 'Onboarding');
            suggestedDeals.sort((a, b) => {
                if (a.status === 'Onboarding' && b.status !== 'Onboarding') return -1;
                if (b.status === 'Onboarding' && a.status !== 'Onboarding') return 1;
                const aAge = a.lastTouchpointDate ? daysBetween(a.lastTouchpointDate, today) : 9999;
                const bAge = b.lastTouchpointDate ? daysBetween(b.lastTouchpointDate, today) : 9999;
                return bAge - aAge; 
            });
        }

        renderSuggestions(suggestedDeals);
        renderRoutePlanner(scheduledDeals, scheduledActs);
    }

    function renderSuggestions(deals) {
        const container = document.getElementById('modal-planner-suggestions');
        if (!container) return;
        container.innerHTML = '';
        
        if (deals.length === 0) {
            container.innerHTML = '<div class="text-center p-6 text-gray-400 text-sm">No targets available for this view. Try adjusting tabs or adding a new prospect.</div>';
            return;
        }

        const today = new Date();
        deals.forEach(d => {
            const isDecaying = !d.lastTouchpointDate || daysBetween(d.lastTouchpointDate, today) > 30;
            let heatColorClass = d.heatLevel === 'Hot' ? 'bg-red-100 text-red-700' : (d.heatLevel === 'Warm' ? 'bg-yellow-100 text-yellow-800' : 'bg-blue-100 text-blue-700');
            
            let statusBadge = '';
            if (d.status === 'Onboarding') {
                statusBadge = `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold uppercase bg-purple-100 text-purple-700 border border-purple-200 ml-1">Onboarding</span>`;
            } else if (d.status === 'Client') {
                statusBadge = `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold uppercase bg-green-100 text-green-700 ml-1">Client</span>`;
            }

            container.innerHTML += `
                <div onclick="selectSuggestionForItinerary('${d.id}')"
                     class="bg-white p-3 rounded-lg border ${d.status === 'Onboarding' ? 'border-purple-300' : (isDecaying ? 'border-red-200' : 'border-gray-200')} shadow-sm cursor-pointer hover:shadow-md hover:border-brand-400 transition-all relative overflow-hidden group">
                    ${isDecaying && d.status !== 'Onboarding' ? '<div class="absolute left-0 top-0 bottom-0 w-1 bg-red-500"></div>' : ''}
                    ${d.status === 'Onboarding' ? '<div class="absolute left-0 top-0 bottom-0 w-1 bg-purple-500"></div>' : ''}
                    <div class="flex justify-between items-start pl-2">
                        <div>
                            <h3 class="font-bold text-sm text-gray-800 group-hover:text-brand-600 transition-colors">${d.dealershipName} ${statusBadge}</h3>
                            <p class="text-xs text-gray-500 truncate max-w-[250px]">${d.address}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="px-2 py-1 rounded-md text-xs font-bold bg-brand-50 text-brand-600 opacity-0 group-hover:opacity-100 transition-opacity">Insert</span>
                            <div class="text-xs font-mono bg-gray-100 px-1.5 py-0.5 rounded text-gray-600 whitespace-nowrap">${d.distanceFromHome} mi</div>
                        </div>
                    </div>
                    <div class="flex justify-between items-center mt-2 pl-2">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-medium ${d.usedCarsOnLot < 50 ? 'text-red-500' : 'text-gray-600'}"><i class="fa-solid fa-car-side mr-1"></i>${d.usedCarsOnLot}</span>
                        </div>
                        <span class="px-1.5 py-0.5 rounded text-[10px] font-bold uppercase ${heatColorClass}">${d.heatLevel}</span>
                    </div>
                </div>
            `;
        });
    }

    function openSmartSuggestions(index) {
        currentInsertIndex = index;
        document.getElementById('modal-smart-suggestions').classList.remove('hidden');
        renderDashboard();
    }

    function selectSuggestionForItinerary(dealershipId) {
        const dateStr = document.getElementById('planner-date').value;
        if(!dateStr) return showToast("Please select a date first.", "error");

        const scheduledActs = db.activities.filter(a => a.repId === currentUser.id && a.plannedDate === dateStr && a.status === 'pending');
        scheduledActs.sort((a,b) => (a.orderIndex || 0) - (b.orderIndex || 0));
        
        for(let i = currentInsertIndex; i < scheduledActs.length; i++) {
            scheduledActs[i].orderIndex = i + 1;
        }
        
        db.activities.push({
            id: generateId('a'), repId: currentUser.id, dealershipId: dealershipId, contactId: null,
            activityType: 'Planned Visit', communicationType: 'In-Person', status: 'pending',
            completedAt: null, notes: '', 
            nextActionDate: formatDate(dateStr),
            plannedDate: dateStr,
            orderIndex: currentInsertIndex
        });

        closeModal('modal-smart-suggestions');
        renderDashboard();
        showToast("Stop added to itinerary.");
    }

    // --- ITINERARY DRAG & DROP ---
    function itineraryDragStart(event, actId) {
        draggedActId = actId;
        event.dataTransfer.effectAllowed = 'move';
        event.target.classList.add('opacity-50', 'scale-[0.98]');
    }

    function itineraryDragEnd(event) {
        event.target.classList.remove('opacity-50', 'scale-[0.98]');
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        draggedActId = null;
    }

    function itineraryDragOver(event) {
        event.preventDefault();
        event.dataTransfer.dropEffect = 'move';
        event.currentTarget.classList.add('drag-over');
    }

    function itineraryDragLeave(event) {
        event.currentTarget.classList.remove('drag-over');
    }

    function itineraryDropSlot(event, insertIndex) {
        event.preventDefault();
        event.currentTarget.classList.remove('drag-over');
        if (!draggedActId) return;

        const dateStr = document.getElementById('planner-date').value;
        const scheduledActs = db.activities.filter(a => a.repId === currentUser.id && a.plannedDate === dateStr && a.status === 'pending');
        scheduledActs.sort((a,b) => (a.orderIndex || 0) - (b.orderIndex || 0));

        const draggedAct = scheduledActs.find(a => a.id === draggedActId);
        if (!draggedAct) return;

        const oldIndex = scheduledActs.indexOf(draggedAct);
        scheduledActs.splice(oldIndex, 1);
        
        let actualInsertIndex = insertIndex;
        if (oldIndex < insertIndex) actualInsertIndex--; 
        
        scheduledActs.splice(actualInsertIndex, 0, draggedAct);
        scheduledActs.forEach((a, i) => a.orderIndex = i);

        renderDashboard();
        showToast("Stop reordered successfully.");
    }

    function renderRoutePlanner(scheduledDeals, scheduledActs) {
        const body = document.getElementById('route-planner-body');
        body.innerHTML = '';
        body.classList.remove('hidden');
        
        const count = scheduledDeals.length;
        const gText = document.getElementById('gamification-text');
        const gCount = document.getElementById('gamification-count');
        const gBar = document.getElementById('gamification-bar');
        
        gCount.innerText = `${count}/4`;
        let percentage = Math.min((count / 4) * 100, 100);
        gBar.style.width = `${percentage}%`;
        
        if (count === 0) {
            gText.innerText = "Target: 2-4 Visits";
            gText.className = "font-medium text-gray-500";
            gBar.className = "h-full bg-gray-300 w-0 transition-all duration-700 ease-out rounded-full relative";
        } else if (count === 1) {
            gText.innerText = "Getting started...";
            gText.className = "font-medium text-red-600";
            gBar.className = "h-full bg-red-500 transition-all duration-700 ease-out rounded-full relative";
        } else if (count === 2) {
            gText.innerText = "Minimum Reached! 🚀";
            gText.className = "font-bold text-yellow-600";
            gBar.className = "h-full bg-yellow-500 transition-all duration-700 ease-out rounded-full relative";
        } else if (count === 3) {
            gText.innerText = "Great Day Planned! 🔥";
            gText.className = "font-bold text-green-600";
            gBar.className = "h-full bg-green-500 transition-all duration-700 ease-out rounded-full relative";
        } else if (count >= 4) {
            gText.innerText = "Maximized Route! 🏆";
            gText.className = "font-bold text-brand-600";
            gBar.className = "h-full bg-brand-500 transition-all duration-700 ease-out rounded-full relative";
        }

        scheduledActs.sort((a,b) => (a.orderIndex || 0) - (b.orderIndex || 0));
        
        const renderSlot = (index) => `
            <div ondragover="itineraryDragOver(event)" ondragleave="itineraryDragLeave(event)" ondrop="itineraryDropSlot(event, ${index})" onclick="openSmartSuggestions(${index})" class="border-2 border-dashed border-gray-200 rounded-lg p-2 text-center text-gray-400 hover:text-brand-600 hover:border-brand-300 hover:bg-brand-50 cursor-pointer transition-all flex items-center justify-center gap-2 group mx-2 md:mx-10 my-2">
                <div class="w-6 h-6 rounded-full bg-gray-100 group-hover:bg-brand-200 flex items-center justify-center transition-colors"><i class="fa-solid fa-plus text-xs"></i></div>
                <span class="text-xs font-semibold uppercase tracking-wider">Add Stop Here</span>
            </div>
        `;
        
        body.innerHTML += renderSlot(0);

        scheduledActs.forEach((act, index) => {
            const d = db.dealerships.find(x => x.id === act.dealershipId);
            if (!d) return;

            let heatColorClass = d.heatLevel === 'Hot' ? 'bg-red-100 text-red-700' : (d.heatLevel === 'Warm' ? 'bg-yellow-100 text-yellow-800' : 'bg-blue-100 text-blue-700');
            
            let statusBadge = '';
            if (d.status === 'Onboarding') statusBadge = '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold uppercase bg-purple-100 text-purple-700 border border-purple-200">Onboarding</span>';
            else if (d.status === 'Client') statusBadge = '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold uppercase bg-green-100 text-green-700">Client</span>';
            else statusBadge = '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold uppercase bg-gray-100 text-gray-600">Prospect</span>';

            body.innerHTML += `
                <div draggable="true" ondragstart="itineraryDragStart(event, '${act.id}')" ondragend="itineraryDragEnd(event)" class="bg-white p-3 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between group hover:border-brand-400 transition-all duration-200 cursor-pointer relative" onclick="openQuickDealershipDetail('${d.id}')">
                    <div class="flex items-center gap-3">
                        <div class="w-6 h-6 rounded-full bg-gray-100 text-gray-400 flex items-center justify-center font-bold text-xs flex-shrink-0 cursor-grab active:cursor-grabbing hover:bg-brand-100 hover:text-brand-600 transition-colors" title="Drag to reorder"><i class="fa-solid fa-grip-vertical"></i></div>
                        <div>
                            <div class="flex items-center gap-2 mb-0.5">
                                <div class="w-5 h-5 rounded-full bg-brand-50 text-brand-700 flex items-center justify-center font-bold text-[10px]">${index + 1}</div>
                                <h3 class="font-bold text-gray-900 group-hover:text-brand-600 transition-colors text-sm">${d.dealershipName}</h3>
                                ${statusBadge}
                            </div>
                            <p class="text-xs text-gray-500"><i class="fa-solid fa-map-pin mr-1 text-gray-400"></i>${d.address}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="text-right hidden sm:block">
                            <span class="px-2 py-1 rounded text-[10px] font-bold uppercase ${heatColorClass}">${d.heatLevel}</span>
                            <div class="text-xs font-mono mt-1 text-gray-500">${d.distanceFromHome} mi</div>
                        </div>
                        <div class="flex flex-col gap-1 hidden md:flex">
                            <button onclick="event.stopPropagation(); moveItineraryStop('${act.id}', -1)" class="w-6 h-6 rounded bg-gray-50 text-gray-400 hover:bg-brand-50 hover:text-brand-600 transition-colors flex items-center justify-center border border-gray-100"><i class="fa-solid fa-chevron-up text-[10px]"></i></button>
                            <button onclick="event.stopPropagation(); moveItineraryStop('${act.id}', 1)" class="w-6 h-6 rounded bg-gray-50 text-gray-400 hover:bg-brand-50 hover:text-brand-600 transition-colors flex items-center justify-center border border-gray-100"><i class="fa-solid fa-chevron-down text-[10px]"></i></button>
                        </div>
                        <button onclick="event.stopPropagation(); removeFromItinerary('${act.id}')" class="w-8 h-8 rounded-full bg-red-50 text-red-400 hover:bg-red-100 hover:text-red-600 transition-colors flex items-center justify-center shadow-sm border border-red-100 ml-1" title="Remove">
                            <i class="fa-solid fa-times"></i>
                        </button>
                    </div>
                </div>
            `;
            
            body.innerHTML += renderSlot(index + 1);
        });
    }

    function moveItineraryStop(actId, direction) {
        const dateStr = document.getElementById('planner-date').value;
        const scheduledActs = db.activities.filter(a => a.repId === currentUser.id && a.plannedDate === dateStr && a.status === 'pending');
        scheduledActs.sort((a,b) => (a.orderIndex || 0) - (b.orderIndex || 0));
        
        const index = scheduledActs.findIndex(a => a.id === actId);
        if (index < 0) return;
        
        const newIndex = index + direction;
        if (newIndex < 0 || newIndex >= scheduledActs.length) return;
        
        const temp = scheduledActs[index].orderIndex;
        scheduledActs[index].orderIndex = scheduledActs[newIndex].orderIndex;
        scheduledActs[newIndex].orderIndex = temp;
        
        renderDashboard();
    }

    function removeFromItinerary(activityId) {
        db.activities = db.activities.filter(a => a.id !== activityId);
        
        const dateStr = document.getElementById('planner-date').value;
        const scheduledActs = db.activities.filter(a => a.repId === currentUser.id && a.plannedDate === dateStr && a.status === 'pending');
        scheduledActs.sort((a,b) => (a.orderIndex || 0) - (b.orderIndex || 0));
        scheduledActs.forEach((a, i) => a.orderIndex = i);

        renderDashboard();
        showToast("Stop removed from itinerary.");
    }

    function calculateBoomerang() {
        const dateStr = document.getElementById('planner-date').value;
        const scheduledActs = db.activities.filter(a => a.repId === currentUser.id && a.plannedDate === dateStr && a.status === 'pending');
        
        if (scheduledActs.length < 2) {
            return showToast("Add at least 2 stops to calculate a Boomerang Route.", "error");
        }

        scheduledActs.sort((a, b) => {
            const dealA = db.dealerships.find(d => d.id === a.dealershipId);
            const dealB = db.dealerships.find(d => d.id === b.dealershipId);
            return (dealB?.distanceFromHome || 0) - (dealA?.distanceFromHome || 0);
        });
        
        scheduledActs.forEach((a, i) => a.orderIndex = i);

        renderDashboard();
        showToast("🚀 Boomerang Route Optimized!");
    }

    // --- PIPELINE LOGIC ---
    function renderPipeline() {
        const board = document.getElementById('pipeline-board');
        if(!board) return;
        board.innerHTML = '';
        
        let deals = [...db.dealerships];
        const today = new Date();

        const ownerFilter = document.getElementById('filter-pipeline-owner')?.value || 'my';
        if (ownerFilter === 'my') {
            deals = deals.filter(d => d.ownerId === currentUser.id);
        } else if (ownerFilter === 'team') {
            if (currentUser.role === 'manager') {
                const teamUserIds = db.users.filter(u => u.managerId === currentUser.id || u.id === currentUser.id).map(u => u.id);
                deals = deals.filter(d => teamUserIds.includes(d.ownerId));
            } else {
                deals = deals.filter(d => d.ownerId);
            }
        } else if (ownerFilter !== 'all') {
            deals = deals.filter(d => d.ownerId === ownerFilter);
        }

        const sizeFilter = document.getElementById('filter-pipeline-size')?.value || 'all';
        if (sizeFilter === '50+') deals = deals.filter(d => (d.usedCarsOnLot || 0) >= 50);
        else if (sizeFilter === '<50') deals = deals.filter(d => (d.usedCarsOnLot || 0) < 50);
        else if (sizeFilter === '100+') deals = deals.filter(d => (d.usedCarsOnLot || 0) >= 100);

        const typeFilter = document.getElementById('filter-pipeline-type')?.value || 'all';
        if (typeFilter !== 'all') deals = deals.filter(d => d.dealershipType === typeFilter);

        const activityFilter = document.getElementById('filter-pipeline-activity')?.value || 'all';
        const scheduledDealIds = db.activities.filter(a => a.status === 'pending').map(a => a.dealershipId);

        if (activityFilter === 'scheduled') deals = deals.filter(d => scheduledDealIds.includes(d.id));
        else if (activityFilter === 'decaying') deals = deals.filter(d => !d.lastTouchpointDate || daysBetween(d.lastTouchpointDate, today) > 30);
        else if (activityFilter === 'noscheduled') deals = deals.filter(d => !scheduledDealIds.includes(d.id));

        const dateFilter = document.getElementById('filter-pipeline-date')?.value || 'all';
        if (dateFilter === '7d') deals = deals.filter(d => d.createdAt && daysBetween(d.createdAt, today) <= 7);
        else if (dateFilter === '30d') deals = deals.filter(d => d.createdAt && daysBetween(d.createdAt, today) <= 30);

        const heatFilter = document.getElementById('filter-pipeline-heat')?.value || 'all';
        if (heatFilter !== 'all') deals = deals.filter(d => d.heatLevel === heatFilter);

        const searchTerm = document.getElementById('search-pipeline')?.value?.toLowerCase().trim();
        if (searchTerm) deals = deals.filter(d => d.dealershipName.toLowerCase().includes(searchTerm) || d.address.toLowerCase().includes(searchTerm));

        const counter = document.getElementById('pipeline-deal-counter');
        if (counter) counter.innerText = `${deals.length} Deal${deals.length === 1 ? '' : 's'}`;

        const hideClients = document.getElementById('pipeline-hide-clients')?.checked ?? true;
        const allStages = [
            { id: 'Uncontacted', label: 'Uncontacted', badgeColor: 'bg-gray-100 text-gray-700', border: 'border-gray-200' },
            { id: 'In Progress', label: 'In Progress', badgeColor: 'bg-blue-100 text-blue-700', border: 'border-blue-200' },
            { id: 'Handed Off', label: 'Handed Off', badgeColor: 'bg-yellow-100 text-yellow-800', border: 'border-yellow-200' },
            { id: 'Onboarding', label: 'Onboarding', badgeColor: 'bg-purple-100 text-purple-700', border: 'border-purple-200' },
            { id: 'Client', label: 'Client (Won)', badgeColor: 'bg-green-100 text-green-700', border: 'border-green-200' },
            { id: 'Parked', label: 'Parked', badgeColor: 'bg-red-100 text-red-700', border: 'border-red-200' }
        ];

        const stages = hideClients ? allStages.filter(s => s.id !== 'Onboarding' && s.id !== 'Client') : allStages;
        const sortOption = document.getElementById('sort-pipeline')?.value || 'manual';

        stages.forEach(stage => {
            let dealsInStage = deals.filter(d => {
                const realStatus = getRealStatus(d);
                if (stage.id === 'Handed Off') return realStatus.includes('Handoff') || d.status === 'Handed Off';
                if (stage.id === 'Parked') return realStatus === 'Parked' || realStatus === 'Auto-Parked';
                return realStatus === stage.id;
            });

            if (sortOption === 'inventory-desc') dealsInStage.sort((a, b) => (b.usedCarsOnLot || 0) - (a.usedCarsOnLot || 0));
            else if (sortOption === 'decay-asc') dealsInStage.sort((a, b) => {
                const timeA = a.lastTouchpointDate ? new Date(a.lastTouchpointDate).getTime() : 0;
                const timeB = b.lastTouchpointDate ? new Date(b.lastTouchpointDate).getTime() : 0;
                return timeA - timeB;
            });
            else if (sortOption === 'heat-desc') {
                const heatRank = { 'Hot': 3, 'Warm': 2, 'Cold': 1 };
                dealsInStage.sort((a, b) => (heatRank[b.heatLevel] || 0) - (heatRank[a.heatLevel] || 0));
            } else if (sortOption === 'name-asc') dealsInStage.sort((a, b) => a.dealershipName.localeCompare(b.dealershipName));
            else dealsInStage.sort((a, b) => (a.manualOrder ?? 999) - (b.manualOrder ?? 999));

            let colHtml = `
                <div class="w-80 flex-shrink-0 flex flex-col bg-gray-100/50 rounded-xl border ${stage.border} h-full max-h-full overflow-hidden shadow-sm">
                    <div class="p-3 border-b border-gray-200 bg-white flex justify-between items-center rounded-t-xl flex-shrink-0">
                        <h3 class="font-bold text-gray-800 text-xs uppercase tracking-wider">${stage.label}</h3>
                        <span class="${stage.badgeColor} text-xs font-bold px-2 py-0.5 rounded-full">${dealsInStage.length}</span>
                    </div>
                    <div class="p-3 overflow-y-auto flex-grow space-y-3 custom-scrollbar pipeline-col-body transition-colors rounded-b-xl"
                         ondragover="handlePipelineColDragOver(event)"
                         ondragleave="handlePipelineColDragLeave(event)"
                         ondrop="handlePipelineColDrop(event, '${stage.id}')">
            `;

            if (dealsInStage.length === 0) {
                colHtml += `<div class="p-6 text-center text-xs text-gray-400 border border-dashed border-gray-300 rounded-lg pointer-events-none">Drop deals here</div>`;
            } else {
                dealsInStage.forEach(d => {
                    const isDecaying = !d.lastTouchpointDate || daysBetween(d.lastTouchpointDate, today) > 30;
                    const hasScheduled = scheduledDealIds.includes(d.id);
                    const ownerUser = db.users.find(u => u.id === d.ownerId);
                    let heatColor = d.heatLevel === 'Hot' ? 'bg-red-100 text-red-700' : (d.heatLevel === 'Warm' ? 'bg-yellow-100 text-yellow-800' : 'bg-blue-100 text-blue-700');

                    colHtml += `
                        <div id="pipeline-card-${d.id}"
                             draggable="true"
                             ondragstart="handlePipelineCardDragStart(event, '${d.id}')"
                             ondragend="handlePipelineCardDragEnd(event, '${d.id}')"
                             ondragover="handlePipelineCardDragOver(event)"
                             ondragleave="handlePipelineCardDragLeave(event)"
                             ondrop="handlePipelineCardDrop(event, '${d.id}', '${stage.id}')"
                             onclick="openQuickDealershipDetail('${d.id}')" 
                             class="pipeline-card-item pipeline-card-draggable bg-white p-3.5 rounded-xl shadow-sm border border-gray-200 hover:border-brand-500 hover:shadow-md transition-all group relative">
                            
                            <div class="flex justify-between items-start gap-2 mb-1.5">
                                <div class="flex items-center gap-1.5 min-w-0">
                                    <i class="fa-solid fa-grip-vertical text-gray-300 group-hover:text-gray-400 text-xs flex-shrink-0 cursor-grab" title="Drag to reorder"></i>
                                    <h4 class="font-bold text-sm text-gray-900 group-hover:text-brand-600 transition-colors leading-tight truncate">${d.dealershipName}</h4>
                                </div>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded uppercase ${heatColor} flex-shrink-0">${d.heatLevel}</span>
                            </div>
                            
                            <p class="text-xs text-gray-500 mb-2 truncate"><i class="fa-solid fa-location-dot mr-1 text-gray-400"></i>${d.address}</p>

                            <div class="flex items-center gap-1.5 flex-wrap mb-2.5">
                                <span class="text-[10px] font-semibold px-2 py-0.5 rounded ${d.dealershipType === 'Franchise' ? 'bg-blue-50 text-blue-700 border border-blue-200' : 'bg-gray-100 text-gray-600 border border-gray-200'}">${d.dealershipType}</span>
                                <span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-gray-50 text-gray-700 border border-gray-200"><i class="fa-solid fa-car text-gray-400 mr-1"></i>${d.usedCarsOnLot} cars</span>
                                ${ownerUser ? `<span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-purple-50 text-purple-700 border border-purple-200"><i class="fa-solid fa-user-circle mr-1"></i>${ownerUser.firstName}</span>` : ''}
                            </div>

                            <div class="flex justify-between items-center text-[11px] pt-2 border-t border-gray-100">
                                ${hasScheduled 
                                    ? `<span class="text-green-600 font-medium flex items-center gap-1"><i class="fa-solid fa-calendar-check"></i> Stop planned</span>` 
                                    : (isDecaying 
                                        ? `<span class="text-red-500 font-semibold flex items-center gap-1"><i class="fa-solid fa-fire"></i> Attention (${d.lastTouchpointDate ? daysBetween(d.lastTouchpointDate, today) + 'd' : 'Cold'})</span>` 
                                        : `<span class="text-gray-400">Active</span>`)
                                }
                                <span class="font-mono text-gray-500">${d.distanceFromHome} mi</span>
                            </div>
                        </div>
                    `;
                });
            }

            colHtml += `</div></div>`;
            board.innerHTML += colHtml;
        });
    }

    function handlePipelineCardDragStart(e, id) {
        draggedDealershipId = id;
        e.dataTransfer.setData('text/plain', id);
        e.dataTransfer.effectAllowed = 'move';
        setTimeout(() => {
            const el = document.getElementById('pipeline-card-' + id);
            if (el) el.classList.add('drag-card-ghost');
        }, 0);
    }

    function handlePipelineCardDragEnd(e, id) {
        const el = document.getElementById('pipeline-card-' + id);
        if (el) el.classList.remove('drag-card-ghost');
        document.querySelectorAll('.pipeline-card-item').forEach(c => c.classList.remove('drag-target-hover', 'ring-2', 'ring-brand-500'));
        document.querySelectorAll('.pipeline-col-body').forEach(c => c.classList.remove('drag-target-hover'));
        draggedDealershipId = null;
    }

    function handlePipelineCardDragOver(e) {
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'move';
        e.currentTarget.classList.add('drag-target-hover', 'ring-2', 'ring-brand-500');
    }

    function handlePipelineCardDragLeave(e) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-target-hover', 'ring-2', 'ring-brand-500');
    }

    function handlePipelineCardDrop(e, targetCardId, targetStageId) {
        e.preventDefault();
        e.stopPropagation();
        e.currentTarget.classList.remove('drag-target-hover', 'ring-2', 'ring-brand-500');

        const draggedId = draggedDealershipId || e.dataTransfer.getData('text/plain');
        if (!draggedId || draggedId === targetCardId) return;

        const draggedDeal = db.dealerships.find(d => d.id === draggedId);
        const targetDeal = db.dealerships.find(d => d.id === targetCardId);
        if (!draggedDeal) return;

        const sortSelect = document.getElementById('sort-pipeline');
        if (sortSelect && sortSelect.value !== 'manual') {
            sortSelect.value = 'manual';
            showToast("Switched sorting to Manual Order mode");
        }

        const currentStageOfDragged = getStageForDeal(draggedDeal);
        if (currentStageOfDragged !== targetStageId) {
            moveDealToStage(draggedDeal, targetStageId, targetDeal);
        } else {
            reorderDealsInStage(targetStageId, draggedDeal, targetDeal);
            renderPipeline();
            showToast(`Reordered "${draggedDeal.dealershipName}"`);
        }
        draggedDealershipId = null;
    }

    function handlePipelineColDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        e.currentTarget.classList.add('drag-target-hover');
    }

    function handlePipelineColDragLeave(e) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-target-hover');
    }

    function handlePipelineColDrop(e, targetStageId) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-target-hover');
        const draggedId = draggedDealershipId || e.dataTransfer.getData('text/plain');
        if (!draggedId) return;

        const draggedDeal = db.dealerships.find(d => d.id === draggedId);
        if (!draggedDeal) return;

        const currentStageOfDragged = getStageForDeal(draggedDeal);
        if (currentStageOfDragged !== targetStageId) {
            const sortSelect = document.getElementById('sort-pipeline');
            if (sortSelect && sortSelect.value !== 'manual') sortSelect.value = 'manual';
            moveDealToStage(draggedDeal, targetStageId, null);
        }
        draggedDealershipId = null;
    }

    function reorderDealsInStage(stageId, draggedDeal, targetDeal) {
        let stageDeals = db.dealerships.filter(d => getStageForDeal(d) === stageId);
        stageDeals.sort((a, b) => (a.manualOrder ?? 999) - (b.manualOrder ?? 999));
        stageDeals = stageDeals.filter(d => d.id !== draggedDeal.id);

        if (targetDeal) {
            const targetIdx = stageDeals.findIndex(d => d.id === targetDeal.id);
            if (targetIdx !== -1) stageDeals.splice(targetIdx, 0, draggedDeal);
            else stageDeals.push(draggedDeal);
        } else {
            stageDeals.push(draggedDeal);
        }

        stageDeals.forEach((deal, idx) => {
            deal.manualOrder = idx;
        });
    }

    function moveDealToStage(draggedDeal, targetStageId, targetDeal) {
        const oldStatus = getRealStatus(draggedDeal);

        if (targetStageId === 'In Progress' && oldStatus === 'Uncontacted') {
            activeDealershipId = draggedDeal.id;
            showToast("Please log a sales stop to move account to In Progress.");
            openSalesStopWizard();
            return;
        }

        if (targetStageId === 'Handed Off' && oldStatus !== 'Handed Off' && !oldStatus.includes('Handoff')) {
            if (oldStatus === 'Uncontacted') {
                return showToast("Cannot hand off an Uncontacted account. Please log a sales stop first.", "error");
            }
            activeDealershipId = draggedDeal.id;
            initiateHandoff();
            return; 
        }

        if (targetStageId === 'Parked' && oldStatus !== 'Parked' && oldStatus !== 'Auto-Parked') {
            promptParkDealership(draggedDeal.id);
            return;
        }

        draggedDeal.status = targetStageId;
        reorderDealsInStage(targetStageId, draggedDeal, targetDeal);
        renderPipeline();
        showToast(`Moved "${draggedDeal.dealershipName}" to ${targetStageId}`);
    }

    function resetPipelineFilters() {
        if (document.getElementById('sort-pipeline')) document.getElementById('sort-pipeline').value = 'manual';
        if (document.getElementById('filter-pipeline-owner')) document.getElementById('filter-pipeline-owner').value = 'my';
        if (document.getElementById('filter-pipeline-size')) document.getElementById('filter-pipeline-size').value = 'all';
        if (document.getElementById('filter-pipeline-type')) document.getElementById('filter-pipeline-type').value = 'all';
        if (document.getElementById('filter-pipeline-activity')) document.getElementById('filter-pipeline-activity').value = 'all';
        if (document.getElementById('filter-pipeline-date')) document.getElementById('filter-pipeline-date').value = 'all';
        if (document.getElementById('filter-pipeline-heat')) document.getElementById('filter-pipeline-heat').value = 'all';
        if (document.getElementById('search-pipeline')) document.getElementById('search-pipeline').value = '';
        if (document.getElementById('pipeline-hide-clients')) document.getElementById('pipeline-hide-clients').checked = true;
        renderPipeline();
        showToast("Pipeline filters reset to defaults.");
    }

    // --- LIST VIEWS (BENCH, CLIENTS, POOL) ---
    function renderDealerships() {
        const grid = document.getElementById('dealerships-grid');
        if (!grid) return;
        grid.innerHTML = '';
        
        let myDeals = db.dealerships.filter(d => d.ownerId === currentUser.id && d.status !== 'Client' && d.status !== 'Onboarding');
        
        const searchTerm = document.getElementById('search-dealerships')?.value.toLowerCase().trim() || '';
        if (searchTerm) {
            myDeals = myDeals.filter(d => 
                d.dealershipName.toLowerCase().includes(searchTerm) || 
                d.address.toLowerCase().includes(searchTerm)
            );
        }

        if (filters.hideConfirmed) {
            myDeals = myDeals.filter(d => {
                const realStatus = getRealStatus(d);
                return realStatus !== 'Handoff Confirmed' && realStatus !== 'Handoff In Process' && realStatus !== 'Handed Off';
            });
        }

        if (filters.types.length > 0) {
            myDeals = myDeals.filter(d => filters.types.includes(d.dealershipType));
        }

        if (filters.statuses.length > 0) {
            myDeals = myDeals.filter(d => filters.statuses.includes(getRealStatus(d)) || filters.statuses.includes(d.status));
        }

        const sortValue = document.getElementById('sort-dealerships')?.value || 'name-asc';
        myDeals.sort((a, b) => {
            const today = new Date();
            const aDecay = !a.lastTouchpointDate ? 9999 : daysBetween(a.lastTouchpointDate, today);
            const bDecay = !b.lastTouchpointDate ? 9999 : daysBetween(b.lastTouchpointDate, today);
            const heatRank = { 'Hot': 3, 'Warm': 2, 'Cold': 1 };

            if (sortValue === 'name-asc') return a.dealershipName.localeCompare(b.dealershipName);
            if (sortValue === 'distance-asc') return (a.distanceFromHome || 0) - (b.distanceFromHome || 0);
            if (sortValue === 'distance-desc') return (b.distanceFromHome || 0) - (a.distanceFromHome || 0);
            if (sortValue === 'inventory-desc') return (b.usedCarsOnLot || 0) - (a.usedCarsOnLot || 0);
            if (sortValue === 'decay-desc') return bDecay - aDecay;
            if (sortValue === 'heat-desc') return (heatRank[b.heatLevel] || 0) - (heatRank[a.heatLevel] || 0);
            if (sortValue === 'heat-asc') return (heatRank[a.heatLevel] || 0) - (heatRank[b.heatLevel] || 0);
            return 0;
        });

        if (myDeals.length === 0) {
            grid.innerHTML = `<div class="col-span-full p-8 text-center text-gray-500 bg-white rounded-xl border border-gray-100"><i class="fa-solid fa-building text-4xl mb-3 text-gray-300"></i><p>No prospects found matching your active filters.</p></div>`;
            return;
        }

        const today = new Date();
        myDeals.forEach(d => {
            const isDecaying = !d.lastTouchpointDate || daysBetween(d.lastTouchpointDate, today) > 30;
            let displayStatus = getRealStatus(d);
            let heatColor = d.heatLevel === 'Hot' ? 'bg-red-100 text-red-700' : (d.heatLevel === 'Warm' ? 'bg-yellow-100 text-yellow-800' : 'bg-blue-100 text-blue-700');

            const card = document.createElement('div');
            card.className = `bg-white rounded-xl shadow-sm border ${isDecaying ? 'border-red-200' : 'border-gray-200'} p-5 cursor-pointer hover:shadow-xl transition-all duration-300 relative group`;
            card.onclick = () => openDealershipDetail(d.id);
            
            card.innerHTML = `
                <div class="flex justify-between items-start mb-3">
                    <div>
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold ${d.dealershipType === 'Franchise' ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-600'} uppercase mb-1 inline-block">${d.dealershipType}</span>
                        <h3 class="font-bold text-gray-900 group-hover:text-brand-600 transition-colors">${d.dealershipName}</h3>
                    </div>
                    <span class="text-xs font-mono px-2 py-1 rounded border bg-gray-50">${d.distanceFromHome} mi</span>
                </div>
                <div class="text-sm text-gray-500 mb-4 line-clamp-1"><i class="fa-solid fa-map-pin mr-1"></i> ${d.address}</div>
                <div class="flex items-center justify-between pt-3 border-t border-gray-100">
                    <span class="text-xs text-gray-500">${displayStatus}</span>
                    <span class="px-2 py-0.5 rounded text-[10px] font-bold ${heatColor} uppercase">${d.heatLevel}</span>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function openScheduleModal() {
        const dateInput = document.getElementById('sched-date');
        const today = new Date();
        dateInput.value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        
        const pendingAct = db.activities.find(a => a.dealershipId === activeDealershipId && a.status === 'pending');
        if (pendingAct) dateInput.value = pendingAct.plannedDate;

        document.getElementById('modal-schedule').classList.remove('hidden');
    }

    function submitSchedule() {
        const dateStr = document.getElementById('sched-date').value;
        if(!dateStr) return showToast("Please select a date.", "error");

        db.activities = db.activities.filter(a => !(a.dealershipId === activeDealershipId && a.status === 'pending'));

        db.activities.push({
            id: generateId('a'), repId: currentUser.id, dealershipId: activeDealershipId, contactId: null,
            activityType: 'Planned Visit', communicationType: 'In-Person', status: 'pending',
            completedAt: null, notes: '', nextActionDate: formatDate(dateStr),
            plannedDate: dateStr, orderIndex: 99
        });

        const d = db.dealerships.find(x => x.id === activeDealershipId);
        if (d && (d.status === 'Parked' || d.status === 'Uncontacted')) {
            d.status = 'In Progress';
            d.lastTouchpointDate = new Date().toISOString();
        }

        closeModal('modal-schedule');
        
        if (!document.getElementById('modal-quick-detail').classList.contains('hidden')) {
            openQuickDealershipDetail(activeDealershipId);
        } else if (!document.getElementById('view-dealership-detail').classList.contains('hidden')) {
            openDealershipDetail(activeDealershipId);
        }

        showToast(`Target scheduled for ${formatDate(dateStr)}`);
        
        if (currentView === 'dashboard') renderDashboard();
        if (currentView === 'pipeline') renderPipeline();
        if (currentView === 'dealerships') renderDealerships();
    }

    function openSalesStopWizard() {
        const select = document.getElementById('stop-contact');
        if(select) {
            select.innerHTML = '<option value="">-- Select Contact --</option>';
            db.contacts.filter(c => c.dealershipId === activeDealershipId).forEach(c => {
                select.innerHTML += `<option value="${c.id}">${c.firstName} ${c.lastName} (${c.jobTitle})</option>`;
            });
        }
        document.getElementById('form-sales-stop').reset();
        
        const today = new Date();
        document.getElementById('stop-next-date').value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

        document.getElementById('modal-sales-stop').classList.remove('hidden');
    }

    function submitSalesStop() {
        const commType = document.querySelector('input[name="comm_type"]:checked')?.value || 'In-Person';
        const contactId = document.getElementById('stop-contact').value;
        const notes = document.getElementById('stop-notes').value.trim();
        const nextDate = document.getElementById('stop-next-date').value;

        if (!notes) return showToast("Please provide notes for this stop.", "error");

        db.activities.push({
            id: generateId('a'), repId: currentUser.id, dealershipId: activeDealershipId, contactId: contactId || null,
            activityType: 'Sales Stop', communicationType: commType, status: 'completed',
            completedAt: new Date().toISOString(), notes: notes, nextActionDate: nextDate || null
        });

        const d = db.dealerships.find(x => x.id === activeDealershipId);
        if (d) {
            d.lastTouchpointDate = new Date().toISOString();
            if (d.status === 'Uncontacted' || d.status === 'Parked') d.status = 'In Progress';
        }

        closeModal('modal-sales-stop');
        openQuickDealershipDetail(activeDealershipId);
        if (currentView === 'pipeline') renderPipeline();
        if (currentView === 'dashboard') renderDashboard();
        showToast("Sales stop successfully recorded!");
    }

    function submitAddProspect() {
        const id = document.getElementById('ap-id').value;
        const name = document.getElementById('ap-name').value.trim();
        if (!name) return showToast("Dealership Name is required.", "error");

        if (id) {
            const index = db.dealerships.findIndex(d => d.id === id);
            if (index > -1) {
                db.dealerships[index].dealershipName = name;
                db.dealerships[index].phone = document.getElementById('ap-phone').value.trim();
                db.dealerships[index].address = document.getElementById('ap-address').value.trim();
                db.dealerships[index].dealershipType = document.getElementById('ap-type').value;
                db.dealerships[index].usedCarsOnLot = parseInt(document.getElementById('ap-cars').value) || 0;

                showToast("Dealership updated successfully.");

    function promptParkDealership(id) {
        dealershipToPark = id;
        const parkNote = document.getElementById('park-note');
        if (parkNote) parkNote.value = '';
        document.getElementById('modal-confirm-park').classList.remove('hidden');
    }

    function executeParkDealership() {
        if(!dealershipToPark) return;
        
        const note = document.getElementById('park-note')?.value.trim();
        if (!note) {
            return showToast("Please provide a reason for parking the account.", "error");
        }

        const pendingActIndex = db.activities.findIndex(a => a.dealershipId === dealershipToPark && a.status === 'pending');
        if (pendingActIndex > -1) {
            const pendingAct = db.activities[pendingActIndex];
            db.activities.push({
                id: generateId('a'), repId: currentUser.id, dealershipId: dealershipToPark, contactId: null,
                activityType: 'System Log', communicationType: 'System', status: 'completed',
                completedAt: new Date().toISOString(), notes: `Schedule Cancelled (Account Parked). Originally planned for: ${formatDate(pendingAct.plannedDate)}`, nextActionDate: null
            });
            db.activities.splice(pendingActIndex, 1);
        }
        
        db.activities.push({
            id: generateId('a'), repId: currentUser.id, dealershipId: dealershipToPark, contactId: null,
            activityType: 'System Log', communicationType: 'System', status: 'completed',
            completedAt: new Date().toISOString(), notes: `Account Parked: ${note}`, nextActionDate: null
        });

        toggleParkDealership(dealershipToPark, true);
        closeModal('modal-confirm-park');
        dealershipToPark = null;
        if (currentView === 'dashboard') renderDashboard();
    }

    function initiateHandoff() {
        const select = document.getElementById('handoff-closer');
        if (select) {
            select.innerHTML = '<option value="">-- Select Closer --</option>';
            db.users.filter(u => u.role === 'manager' || u.role === 'executive').forEach(u => {
                select.innerHTML += `<option value="${u.id}">${u.firstName} ${u.lastName} (${u.role})</option>`;

        document.getElementById('modal-handoff').classList.remove('hidden');

    function submitHandoff() {
        const closerId = document.getElementById('handoff-closer').value;
        if(!closerId) return showToast("Please select a closer.", "error");

        const d = db.dealerships.find(x => x.id === activeDealershipId);
        d.status = 'Handed Off';
        
        db.payouts.push({
            id: generateId('p'), dealershipId: d.id, dealershipName: d.dealershipName,
            repId: currentUser.id, closerId: closerId,
            handoffDate: new Date().toISOString(), meetingCompleted: false, payoutApproved: false
        });

        db.activities.push({
            id: generateId('a'), repId: currentUser.id, dealershipId: d.id, contactId: null,
            activityType: 'System Log', communicationType: 'System', status: 'completed',
            completedAt: new Date().toISOString(), notes: `Handoff initiated to executive.`, 
            nextActionDate: null
        });

        closeModal('modal-handoff');
        if(!document.getElementById('modal-quick-detail').classList.contains('hidden')) openQuickDealershipDetail(d.id);

        if(currentView === 'pipeline') renderPipeline();
        if(currentView === 'dealerships') renderDealerships();
        if(currentView === 'dashboard') renderDashboard();
        showToast("Account handed off successfully!", "success");

    function cancelHandoff(id) {
        const d = db.dealerships.find(x => x.id === id);

        db.payouts = db.payouts.filter(p => !(p.dealershipId === id && !p.meetingCompleted));
        d.status = 'In Progress';

        `;

        const actionSlot = document.getElementById('audit-action-btn-slot');
        if (currentUser.role === 'finance' && p && p.meetingCompleted && !p.payoutApproved) {
            actionSlot.innerHTML = `
                <button type="button" onclick="openFinanceApproveModal('${p.id}')" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg text-xs font-semibold shadow-sm transition-colors">
                    <i class="fa-solid fa-money-bill-wave mr-1"></i> Authorize Payout ($250)
                </button>
            `;
        } else {
            actionSlot.innerHTML = '';
        }

        document.getElementById('modal-audit').classList.remove('hidden');
    }

    function renderAdmin() {
        const tbody = document.getElementById('admin-users-body');
        if (!tbody) return;
        tbody.innerHTML = '';
        db.users.forEach(u => {
            tbody.innerHTML += `
                <tr class="hover:bg-gray-50">
                    <td class="p-4">
                        <div class="font-bold text-gray-900">${u.firstName} ${u.lastName}</div>
                        <div class="text-xs text-gray-500">${u.email}</div>
                    </td>
                    <td class="p-4 capitalize text-gray-700">${u.role}</td>
                    <td class="p-4 font-mono text-gray-600">${u.homeZipCode}</td>
                </tr>
            `;
        });
    }

    function hideLocationWarning() {
        const banner = document.getElementById('location-warning-banner');
        if (banner) {
            banner.classList.add('translate-y-full');
            setTimeout(() => banner.classList.add('hidden'), 300);
        }
    }

    function showLocationWarning() {
        const banner = document.getElementById('location-warning-banner');
        if (banner) {
            banner.classList.remove('hidden');
            setTimeout(() => banner.classList.remove('translate-y-full'), 10);
        }
    }

    function launchRadarSearch(source = 'home', btnElement = null) {
        if (!currentUser) return;
        
        let locationType = 'home';
        if (source === 'pool') {
            const select = document.getElementById('radar-location-pool');
            if (select) locationType = select.value;
        } else if (source === 'modal') {
            const select = document.getElementById('radar-location-modal');
            if (select) locationType = select.value;
        }

        if (locationType === 'current') {
            if (navigator.geolocation) {
                let originalContent = '';
                if (btnElement) {
                    originalContent = btnElement.innerHTML;
                    btnElement.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Locating...';
                    btnElement.disabled = true;
                }
                
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        if (btnElement) {
                            btnElement.innerHTML = originalContent;
                            btnElement.disabled = false;
                        }
                        
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        const url = MAPS_SEARCH_BASE + 'car+dealerships+near+' + lat + ',' + lng;
                        
                        const newWin = window.open(url, '_blank');
                        
                        if (!newWin || newWin.closed || typeof newWin.closed == 'undefined') {
                            showToast(`📍 Location found! <a href="${url}" target="_blank" class="underline font-bold text-blue-800 ml-1">Click here to open Maps</a>`);
                        } else {
                            showToast("Radar centered on your live coordinates.");
                        }
                    },
                    (err) => {
                        if (btnElement) {
                            btnElement.innerHTML = originalContent;
                            btnElement.disabled = false;
                        }
                        
                        showLocationWarning();
                        
                        const url = MAPS_SEARCH_BASE + 'car+dealerships+near+me';
                        window.open(url, '_blank');
                        showToast("Location denied. Searching 'near me' on Maps.", "error");
                    },
                    { timeout: 10000 }
                );
            } else {
                window.open(MAPS_SEARCH_BASE + 'car+dealerships+near+me', '_blank');
            }
        } else {
            if (!currentUser.homeZipCode) {
                return showToast("Please update your profile with a valid Home Zip Code first.", "error");
            }
            const query = `car dealerships near ${currentUser.homeZipCode}`;
            window.open(MAPS_SEARCH_BASE + encodeURIComponent(query), '_blank');
            showToast("Opening Google Maps radar search around Home Zip...");
        }
    }

    function openUserProfile() {
        document.getElementById('up-fname').value = currentUser.firstName;
        document.getElementById('up-lname').value = currentUser.lastName;
        document.getElementById('up-zip').value = currentUser.homeZipCode;
        document.getElementById('modal-user-profile').classList.remove('hidden');
    }

    function submitUserProfile() {
        currentUser.firstName = document.getElementById('up-fname').value.trim();
        currentUser.lastName = document.getElementById('up-lname').value.trim();
        currentUser.homeZipCode = document.getElementById('up-zip').value.trim();
        document.getElementById('user-name').innerText = `${currentUser.firstName} ${currentUser.lastName}`;
        closeModal('modal-user-profile');
        showToast("Profile saved successfully.");
    }

    function applyFilters() {
        if (currentView === 'dealerships') renderDealerships();
    }

    function clearAllFilters() {
        document.getElementById('filter-hide-confirmed').checked = false;
        document.querySelectorAll('.filter-type, .filter-status').forEach(el => el.checked = false);
        applyFilters();
    }

    function toggleParkDealership(id, forcePark = false) {
        const d = db.dealerships.find(x => x.id === id);
        if (!d) return;
        
        if (forcePark || d.status !== 'Parked') {
            d.status = 'Parked';
            showToast("Account parked. It will be hidden from active views.");
        } else {
            d.status = 'In Progress';
            d.lastTouchpointDate = new Date().toISOString();
            showToast("Account unparked and moved to In Progress.");
        }
        
        if (currentView === 'pipeline') renderPipeline();
        if (currentView === 'dealerships') renderDealerships();
        
        if (!document.getElementById('modal-quick-detail').classList.contains('hidden')) {
            openQuickDealershipDetail(id);
        } else {
            openDealershipDetail(id);
        }
    }

    function claimDealership(id) {
        const d = db.dealerships.find(x => x.id === id);
        if (d) {
            d.ownerId = currentUser.id;
            d.status = 'Uncontacted';
            showToast(`Claimed "${d.dealershipName}" to your Bench!`);
            
            if (currentView === 'pool') renderPool();
            if (currentView === 'dealerships') renderDealerships();
            
            if (!document.getElementById('modal-quick-detail').classList.contains('hidden')) {
                openQuickDealershipDetail(id);
            } else {
                openDealershipDetail(id);
            }
        }
    }
</script>
