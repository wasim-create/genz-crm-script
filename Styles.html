<style>
    body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; overflow: hidden; transition: background-color 0.2s ease, color 0.2s ease; }
    .hide-scroll::-webkit-scrollbar { display: none; }
    .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Toast Animations */
    @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
    .toast-enter { animation: slideInRight 0.3s ease-out forwards; }
    .toast-exit { animation: slideOutRight 0.3s ease-in forwards; }

    /* Sidebar Toggle Styles */
    .sidebar-contracted { width: 4.5rem !important; }
    .sidebar-contracted .sidebar-text { display: none !important; }
    .sidebar-contracted .nav-group-label { display: none !important; }
    .sidebar-contracted .user-profile-info { display: none !important; }
    .sidebar-contracted .nav-btn { justify-content: center; padding-left: 0; padding-right: 0; }
    .sidebar-contracted .brand-logo-container { justify-content: center; width: 100%; gap: 0; }

    /* Custom Toggle Switch */
    .toggle-checkbox:checked { right: 0; border-color: #3b82f6; }
    .toggle-checkbox:checked + .toggle-label { background-color: #3b82f6; }

    /* Drag and Drop Visuals */
    .drag-card-ghost { opacity: 0.45; transform: scale(0.98); }
    .drag-target-hover { border-color: #3b82f6 !important; background-color: #eff6ff !important; }
    .drag-over { background-color: #eff6ff !important; border-color: #3b82f6 !important; }
    .pipeline-card-draggable { cursor: grab; }
    .pipeline-card-draggable:active { cursor: grabbing; }

    /* Custom Scrollbars */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

    /* Global Dark Mode Overrides */
    html.dark body { background-color: #0b1120; color: #f3f4f6; }
    html.dark .bg-white { background-color: #1e293b !important; color: #f3f4f6; }
    html.dark .bg-gray-50, html.dark .bg-gray-50\/50 { background-color: #0f172a !important; }
    html.dark .bg-gray-100, html.dark .bg-gray-100\/50 { background-color: #1e293b !important; }
    html.dark .border-gray-100, html.dark .border-gray-200, html.dark .border-gray-300 { border-color: #334155 !important; }
    html.dark .text-gray-900, html.dark .text-gray-800, html.dark .text-gray-700 { color: #f8fafc !important; }
    html.dark .text-gray-600, html.dark .text-gray-500 { color: #94a3b8 !important; }
    html.dark input, html.dark select, html.dark textarea { background-color: #0f172a !important; color: #f8fafc !important; border-color: #334155 !important; }
    html.dark .shadow-sm { box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.5); }
    html.dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #475569; }
    html.dark .drag-target-hover, html.dark .drag-over { background-color: #1e3a8a33 !important; border-color: #60a5fa !important; }
</style>
